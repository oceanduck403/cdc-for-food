version: "3.9"

services:
  api:
    build: .
    container_name: nutrition-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: nutrition-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: nutrition-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: